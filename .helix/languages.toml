# :workspace-trust to load those
[language-server.nixd.config.nixd.nixpkgs]
expr = 'import (builtins.getFlake (toString ./.)).inputs.nixpkgs { }'

[language-server.nixd.config.nixd.options.nixos]
expr = '(builtins.getFlake (toString ./.)).nixosConfigurations.ember.options'

[language-server.nixd.config.nixd.options.homelab]
expr = '{ homelab = (builtins.getFlake (toString ./.)).nixosConfigurations.ash.options.homelab; }'

[language-server.nixd.config.nixd.options.home-manager]
expr = '(builtins.getFlake (toString ./.)).nixosConfigurations.ember.options.home-manager.users.type.getSubOptions []'

[language-server.nixd.config.nixd.options.flake-parts]
expr = '(builtins.getFlake (toString ./.)).debug.options'

[language-server.nixd.config.nixd.options.perSystem]
expr = '(builtins.getFlake (toString ./.)).allSystems.x86_64-linux.options'
